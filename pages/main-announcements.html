<section class="row" id="announcements">
  <div class="wrap">
    <div class="row-head rv">
      <div>
        <span class="tag">Notice board</span>
        <h2 class="d2">Everything a parent<br>needs to know this month</h2>
      </div>
      <p class="lede" style="align-self:end">Circulars are posted here the same morning they go home in the diary.</p>
    </div>

    <div id="pinnedWrap" class="rv"></div>

    <div class="filters rv" data-d="1" style="margin-top:22px">
      <div id="annChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
    <div class="ann-grid" id="annGrid"></div>
  </div>
</section>

<!-- ===== events ===== -->
<section class="row band-navy curve-top curve-bot" id="events">
  <div class="wrap">
    <div class="row-head rv">
      <div>
        <span class="tag on-navy">Calendar</span>
        <h2 class="d2" style="color:#fff">Put these on<br>the fridge door</h2>
      </div>
      <p class="lede">Dates for the rest of the term. Parents are welcome at everything on this list unless it says otherwise.</p>
    </div>
    <div class="ev-list" id="evList"></div>
    <div class="rv" style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-primary" type="button" data-toast="The term calendar will download as a PDF in the live site.|info">Download the term calendar</button>
      <button class="btn btn-ghost on-navy" type="button" data-goto="#/contact">Ask the office about a date</button>
    </div>
  </div>
</section>
