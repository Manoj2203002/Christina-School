<section class="row" id="staff">
  <div class="wrap">
    <div class="row-head rv">
      <div>
        <span class="tag">Our teachers</span>
        <h2 class="d2">The people your child<br>will remember</h2>
      </div>
      <p class="lede">Thirty-four full-time teachers, a counsellor, a nurse and a librarian. Search by name, or narrow by department.</p>
    </div>

    <div class="filters rv">
      <label class="search">
        <span class="sr-only">Search teachers by name or subject</span>
        <svg class="i i-18"><use href="#ic-search"/></svg>
        <input type="search" id="staffSearch" placeholder="Search by name, subject or class" autocomplete="off" />
      </label>
      <div id="deptChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <span class="small" style="color:var(--ink-50);margin-left:auto" id="staffCount"></span>
    </div>

    <div class="staff-grid" id="staffGrid"></div>
  </div>
</section>
