<section class="aview on" data-pane="staff">
  <div class="tbl-wrap" style="margin-top:0">
    <div class="tbl-top">
      <label class="search" style="max-width:300px"><span class="sr-only">Search staff</span><svg class="i i-18"><use href="#ic-search"/></svg><input type="search" id="aStaffSearch" placeholder="Search staff" /></label>
      <select id="aStaffDept" style="padding:.6rem .9rem;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff"></select>
      <button class="btn btn-primary btn-sm" style="margin-left:auto" type="button" id="addStaff"><svg class="i i-16"><use href="#ic-plus"/></svg> Add staff member</button>
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>Name</th><th>Designation</th><th>Department</th><th>Qualification</th><th>Experience</th><th>Classes</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody id="aStaffBody"></tbody>
    </table></div>
  </div>
</section>
