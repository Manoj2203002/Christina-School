<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="veil" data-close-modal></div>
  <div class="box" id="modalBox">
    <button class="x" data-close-modal aria-label="Close"><svg class="i"><use href="#ic-close"/></svg></button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="admin open" id="admin" style="position:relative;min-height:100vh" aria-label="School admin dashboard">
  <aside class="aside" id="aside">
    <span class="brand">
      <span class="brand-mark" style="width:38px;height:38px" aria-hidden="true"><img src="assets/logo.png" alt="Christina School" class="brand-logo" style="width:36px;height:36px" /></span>
      <span><b>Christina</b><span>Site administration</span></span>
    </span>
    <nav aria-label="Dashboard sections">
      <button data-view="overview" class="on"><svg class="i i-18"><use href="#ic-grid"/></svg> Dashboard</button>
      <button data-view="staff"><svg class="i i-18"><use href="#ic-users"/></svg> Staff <span class="cnt" id="cStaff">0</span></button>
      <button data-view="ann"><svg class="i i-18"><use href="#ic-mega"/></svg> Announcements <span class="cnt" id="cAnn">0</span></button>
      <button data-view="gal"><svg class="i i-18"><use href="#ic-image"/></svg> Gallery <span class="cnt" id="cGal">0</span></button>
      <button data-view="ev"><svg class="i i-18"><use href="#ic-cal"/></svg> Events <span class="cnt" id="cEv">0</span></button>
      <button data-view="ach"><svg class="i i-18"><use href="#ic-trophy"/></svg> Achievements <span class="cnt" id="cAch">0</span></button>
      <button data-view="news"><svg class="i i-18"><use href="#ic-doc"/></svg> News <span class="cnt" id="cNews">0</span></button>
      <button data-view="doc"><svg class="i i-18"><use href="#ic-doc"/></svg> Documents <span class="cnt" id="cDoc">0</span></button>
      <button data-view="enq"><svg class="i i-18"><use href="#ic-mail"/></svg> Enquiries <span class="cnt" id="cEnq">0</span></button>
      <button data-view="set"><svg class="i i-18"><use href="#ic-cog"/></svg> School settings</button>
    </nav>
    <div class="aside-foot">
      <a href="index.html" class="btn btn-ghost on-navy btn-sm" id="viewSite"><svg class="i i-16"><use href="#ic-eye"/></svg> View the website</a>
      <a href="index.html" class="btn btn-primary btn-sm" id="logout"><svg class="i i-16"><use href="#ic-logout"/></svg> Sign out</a>
    </div>
  </aside>
  <div class="amain">
    <div class="atop">
      <button class="burger" id="aBurger" style="display:none" aria-label="Open dashboard menu"><i></i><i></i><i></i></button>
      <div><h2 id="aTitle">Dashboard</h2><span class="sub" id="aSub">Everything happening on the Christina school website today</span></div>
      <div class="push">
        <button class="icon-btn" type="button" data-toast="You have 3 unread enquiries.|info" aria-label="Notifications"><svg class="i i-18"><use href="#ic-bell"/></svg></button>
        <span class="who"><span class="av">RK</span><span><b>Radhika Krishnan</b><span>Principal</span></span></span>
      </div>
    </div>
    <div id="admin-app">
      <!-- Admin router injects views here -->
    </div>
  </div>
</div>
