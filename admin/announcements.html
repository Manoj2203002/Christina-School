<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements — Christina School Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header">
        <h2>Christina School</h2>
        <span>Admin Panel</span>
      </div>
      <nav class="admin-sidebar__nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="staff.html">👥 Staff</a>
        <a href="announcements.html" class="active">📣 Announcements</a>
        <a href="gallery.html">🖼️ Gallery</a>
        <a href="events.html">📅 Events</a>
        <a href="achievements.html">🏆 Achievements</a>
        <a href="news.html">📰 News</a>
        <a href="admissions.html">📝 Admissions</a>
        <a href="settings.html">⚙️ Settings</a>
        <hr>
        <a href="../index.html">🔗 View Website</a>
        <a href="login.html">🚪 Logout</a>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <div class="admin-topbar__search">
          <input type="text" id="searchInput" class="form-input" placeholder="Search announcements...">
        </div>
        <div class="admin-topbar__actions">
          <span class="avatar avatar--sm"></span>
        </div>
      </header>
      <div class="admin-content">
        <div class="flex flex--between" style="margin-bottom: var(--space-6);">
          <h1 class="heading-3">Announcements</h1>
          <button class="btn btn--primary" id="btnAddAnnouncement">+ Add Announcement</button>
        </div>
        
        <div class="card" style="margin-bottom: var(--space-6); padding: var(--space-4);">
          <div class="flex">
            <select id="filterCategory" class="form-select" style="max-width: 200px;">
              <option value="">All Categories</option>
              <option value="Academic">Academic</option>
              <option value="Admissions">Admissions</option>
              <option value="Activities">Activities</option>
              <option value="General">General</option>
            </select>
          </div>
        </div>

        <div class="data-table--responsive">
          <table class="data-table" id="announcementsTable">
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th>Status</th>
                <th>Active Now</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="announcementsTableBody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
          <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state__title">No announcements found</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="announcementModal">
    <div class="modal__backdrop"></div>
    <div class="modal__container">
      <div class="modal__header">
        <h3 class="heading-4" id="modalTitle">Add Announcement</h3>
        <button class="modal__close">&times;</button>
      </div>
      <div class="modal__body">
        <form id="announcementForm" novalidate>
          <input type="hidden" id="annId">
          <div class="form-group">
            <label class="form-label">Title <span class="required-star">*</span></label>
            <input type="text" id="annTitle" class="form-input" data-required="true">
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Category <span class="required-star">*</span></label>
              <select id="annCategory" class="form-select" data-required="true">
                <option value="">Select...</option>
                <option value="Academic">Academic</option>
                <option value="Admissions">Admissions</option>
                <option value="Activities">Activities</option>
                <option value="General">General</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Status</label>
              <select id="annStatus" class="form-select">
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description <span class="required-star">*</span></label>
            <textarea id="annDescription" class="form-textarea" rows="4" data-required="true"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Start Date</label>
              <input type="date" id="annStartDate" class="form-input">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Start Time</label>
              <input type="time" id="annStartTime" class="form-input">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">End Date</label>
              <input type="date" id="annEndDate" class="form-input">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">End Time</label>
              <input type="time" id="annEndTime" class="form-input">
            </div>
          </div>
          <div class="form-group">
            <label class="flex flex--center" style="gap: var(--space-2); justify-content: flex-start;">
              <input type="checkbox" id="annPinned" class="form-checkbox">
              <span>Pin to top</span>
            </label>
          </div>
        </form>
      </div>
      <div class="modal__footer flex flex--between">
        <button class="btn btn--outline" id="btnCancelAnn">Cancel</button>
        <button class="btn btn--primary" id="btnSaveAnn">Save</button>
      </div>
    </div>
  </div>

  <script src="../js/data-store.js" defer></script>
  <script src="../js/modals.js" defer></script>
  <script src="../js/toast.js" defer></script>
  <script src="../js/forms.js" defer></script>
  <script src="../js/admin-announcements.js" defer></script>
</body>
</html>
