<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News — Christina School Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header">
        <h2>Christina School</h2>
        <span>Admin Panel</span>
      </div>
      <nav class="admin-sidebar__nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="staff.html">👥 Staff</a>
        <a href="announcements.html">📣 Announcements</a>
        <a href="gallery.html">🖼️ Gallery</a>
        <a href="events.html">📅 Events</a>
        <a href="achievements.html">🏆 Achievements</a>
        <a href="news.html" class="active">📰 News</a>
        <a href="admissions.html">📝 Admissions</a>
        <a href="settings.html">⚙️ Settings</a>
        <hr>
        <a href="../index.html">🔗 View Website</a>
        <a href="login.html">🚪 Logout</a>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <div class="admin-topbar__search">
          <input type="text" id="searchInput" class="form-input" placeholder="Search news...">
        </div>
        <div class="admin-topbar__actions">
          <span class="avatar avatar--sm"></span>
        </div>
      </header>
      <div class="admin-content">
        <div class="flex flex--between" style="margin-bottom: var(--space-6);">
          <h1 class="heading-3">News Management</h1>
          <button class="btn btn--primary" id="btnAddNews">+ Add Article</button>
        </div>

        <div class="card" style="margin-bottom: var(--space-6); padding: var(--space-4);">
          <div class="flex">
            <select id="filterCategory" class="form-select" style="max-width: 200px;">
              <option value="">All Categories</option>
              <option value="Campus">Campus</option>
              <option value="Achievements">Achievements</option>
              <option value="Admissions">Admissions</option>
              <option value="Activities">Activities</option>
            </select>
          </div>
        </div>

        <div class="data-table--responsive">
          <table class="data-table" id="newsTable">
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="newsTableBody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
          <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state__title">No news articles found</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="newsModal">
    <div class="modal__backdrop"></div>
    <div class="modal__container" style="max-width: 800px;">
      <div class="modal__header">
        <h3 class="heading-4" id="modalTitle">Add Article</h3>
        <button class="modal__close">&times;</button>
      </div>
      <div class="modal__body">
        <form id="newsForm" novalidate>
          <input type="hidden" id="newsId">
          <div class="form-group">
            <label class="form-label">Title <span class="required-star">*</span></label>
            <input type="text" id="newsTitle" class="form-input" data-required="true">
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Category <span class="required-star">*</span></label>
              <select id="newsCategory" class="form-select" data-required="true">
                <option value="">Select...</option>
                <option value="Campus">Campus</option>
                <option value="Achievements">Achievements</option>
                <option value="Admissions">Admissions</option>
                <option value="Activities">Activities</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Date <span class="required-star">*</span></label>
              <input type="date" id="newsDate" class="form-input" data-required="true">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Status</label>
              <select id="newsStatus" class="form-select">
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Featured Image URL</label>
            <input type="url" id="newsImage" class="form-input">
            <img id="newsPreview" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" style="width: 100%; max-height: 200px; object-fit: cover; margin-top: var(--space-2); border-radius: var(--radius-sm);">
          </div>
          <div class="form-group">
            <label class="form-label">Short Description <span class="required-star">*</span> (Max 200 chars)</label>
            <textarea id="newsShort" class="form-textarea" rows="2" maxlength="200" data-required="true"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Full Content <span class="required-star">*</span></label>
            <textarea id="newsContent" class="form-textarea" rows="8" data-required="true"></textarea>
          </div>
        </form>
      </div>
      <div class="modal__footer flex flex--between">
        <button class="btn btn--outline" id="btnCancelNews">Cancel</button>
        <button class="btn btn--primary" id="btnSaveNews">Save</button>
      </div>
    </div>
  </div>

  <div class="modal modal--lg" id="previewModal">
    <div class="modal__backdrop"></div>
    <div class="modal__container" style="max-width: 800px; width: 90%;">
      <div class="modal__header">
        <h3 class="heading-4">Article Preview</h3>
        <button class="modal__close">&times;</button>
      </div>
      <div class="modal__body" id="previewContent">
        <!-- Preview rendered via JS -->
      </div>
    </div>
  </div>

  <script src="../js/data-store.js" defer></script>
  <script src="../js/modals.js" defer></script>
  <script src="../js/toast.js" defer></script>
  <script src="../js/forms.js" defer></script>
  <script src="../js/admin-news.js" defer></script>
</body>
</html>
