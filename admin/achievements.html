<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements — Christina School Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header">
        <h2>Christina School</h2>
        <span>Admin Panel</span>
      </div>
      <nav class="admin-sidebar__nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="staff.html">👥 Staff</a>
        <a href="announcements.html">📣 Announcements</a>
        <a href="gallery.html">🖼️ Gallery</a>
        <a href="events.html">📅 Events</a>
        <a href="achievements.html" class="active">🏆 Achievements</a>
        <a href="news.html">📰 News</a>
        <a href="admissions.html">📝 Admissions</a>
        <a href="settings.html">⚙️ Settings</a>
        <hr>
        <a href="../index.html">🔗 View Website</a>
        <a href="login.html">🚪 Logout</a>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <div class="admin-topbar__search">
          <input type="text" id="searchInput" class="form-input" placeholder="Search achievements...">
        </div>
        <div class="admin-topbar__actions">
          <span class="avatar avatar--sm"></span>
        </div>
      </header>
      <div class="admin-content">
        <div class="flex flex--between" style="margin-bottom: var(--space-6);">
          <h1 class="heading-3">Achievements</h1>
          <button class="btn btn--primary" id="btnAddAch">+ Add Achievement</button>
        </div>

        <div class="data-table--responsive">
          <table class="data-table" id="achTable">
            <thead>
              <tr>
                <th>Student / Team</th>
                <th>Competition</th>
                <th>Result</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="achTableBody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
          <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state__title">No achievements found</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="achModal">
    <div class="modal__backdrop"></div>
    <div class="modal__container">
      <div class="modal__header">
        <h3 class="heading-4" id="modalTitle">Add Achievement</h3>
        <button class="modal__close">&times;</button>
      </div>
      <div class="modal__body">
        <form id="achForm" novalidate>
          <input type="hidden" id="achId">
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Student/Team Name <span class="required-star">*</span></label>
              <input type="text" id="achName" class="form-input" data-required="true">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Grade <span class="required-star">*</span></label>
              <select id="achGrade" class="form-select" data-required="true">
                <option value="">Select...</option>
                <option value="Grade 1">Grade 1</option>
                <option value="Grade 2">Grade 2</option>
                <option value="Grade 3">Grade 3</option>
                <option value="Grade 4">Grade 4</option>
                <option value="Grade 5">Grade 5</option>
                <option value="Grade 6">Grade 6</option>
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value="Grades 6-8">Grades 6-8</option>
                <option value="All Grades">All Grades</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Competition/Event <span class="required-star">*</span></label>
            <input type="text" id="achComp" class="form-input" data-required="true">
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Achievement/Title <span class="required-star">*</span></label>
              <input type="text" id="achTitle" class="form-input" data-required="true">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Result/Place <span class="required-star">*</span></label>
              <input type="text" id="achResult" class="form-input" data-required="true">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Date <span class="required-star">*</span></label>
            <input type="date" id="achDate" class="form-input" data-required="true">
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea id="achDesc" class="form-textarea" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Image URL</label>
            <input type="url" id="achImg" class="form-input">
          </div>
        </form>
      </div>
      <div class="modal__footer flex flex--between">
        <button class="btn btn--outline" id="btnCancelAch">Cancel</button>
        <button class="btn btn--primary" id="btnSaveAch">Save</button>
      </div>
    </div>
  </div>

  <script src="../js/data-store.js" defer></script>
  <script src="../js/modals.js" defer></script>
  <script src="../js/toast.js" defer></script>
  <script src="../js/forms.js" defer></script>
  <script src="../js/admin-achievements.js" defer></script>
</body>
</html>
