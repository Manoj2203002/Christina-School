<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Christina School Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-6);
    }
    .gallery-item {
      background: var(--white);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      position: relative;
    }
    .gallery-item__img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }
    .gallery-item__content {
      padding: var(--space-3);
    }
    .gallery-item__actions {
      position: absolute;
      top: var(--space-2);
      right: var(--space-2);
      background: rgba(255,255,255,0.9);
      border-radius: var(--radius-sm);
      padding: 2px;
      display: flex;
      gap: 2px;
    }
    .gallery-preview {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: var(--gray-100);
      margin-top: var(--space-2);
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header">
        <h2>Christina School</h2>
        <span>Admin Panel</span>
      </div>
      <nav class="admin-sidebar__nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="staff.html">👥 Staff</a>
        <a href="announcements.html">📣 Announcements</a>
        <a href="gallery.html" class="active">🖼️ Gallery</a>
        <a href="events.html">📅 Events</a>
        <a href="achievements.html">🏆 Achievements</a>
        <a href="news.html">📰 News</a>
        <a href="admissions.html">📝 Admissions</a>
        <a href="settings.html">⚙️ Settings</a>
        <hr>
        <a href="../index.html">🔗 View Website</a>
        <a href="login.html">🚪 Logout</a>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <div class="admin-topbar__search">
          <input type="text" id="searchInput" class="form-input" placeholder="Search gallery...">
        </div>
        <div class="admin-topbar__actions">
          <span class="avatar avatar--sm"></span>
        </div>
      </header>
      <div class="admin-content">
        <div class="flex flex--between" style="margin-bottom: var(--space-6);">
          <h1 class="heading-3">Gallery Management</h1>
          <button class="btn btn--primary" id="btnAddImage">+ Add Image</button>
        </div>
        
        <div class="card" style="margin-bottom: var(--space-6); padding: var(--space-4);">
          <div class="flex">
            <select id="filterAlbum" class="form-select" style="max-width: 200px;">
              <option value="">All Albums</option>
              <option value="Campus Life">Campus Life</option>
              <option value="STEM Programs">STEM Programs</option>
              <option value="Arts & Culture">Arts & Culture</option>
              <option value="Sports Day">Sports Day</option>
              <option value="Community">Community</option>
            </select>
          </div>
        </div>

        <div id="galleryContainer" class="gallery-grid">
          <!-- Rendered via JS -->
        </div>
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-state__title">No images found</div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="galleryModal">
    <div class="modal__backdrop"></div>
    <div class="modal__container">
      <div class="modal__header">
        <h3 class="heading-4" id="modalTitle">Add Image</h3>
        <button class="modal__close">&times;</button>
      </div>
      <div class="modal__body">
        <form id="galleryForm" novalidate>
          <input type="hidden" id="galId">
          <div class="form-group">
            <label class="form-label">Image URL <span class="required-star">*</span></label>
            <input type="url" id="galUrl" class="form-input" data-required="true">
            <img id="galPreview" class="gallery-preview" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Preview">
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Album <span class="required-star">*</span></label>
              <select id="galAlbum" class="form-select" data-required="true">
                <option value="">Select...</option>
                <option value="Campus Life">Campus Life</option>
                <option value="STEM Programs">STEM Programs</option>
                <option value="Arts & Culture">Arts & Culture</option>
                <option value="Sports Day">Sports Day</option>
                <option value="Community">Community</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Category</label>
              <select id="galCategory" class="form-select">
                <option value="Academics">Academics</option>
                <option value="Activities">Activities</option>
                <option value="Sports">Sports</option>
                <option value="Events">Events</option>
                <option value="Facilities">Facilities</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Caption <span class="required-star">*</span></label>
            <input type="text" id="galCaption" class="form-input" data-required="true">
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Alt Text <span class="required-star">*</span></label>
              <input type="text" id="galAlt" class="form-input" data-required="true">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Status</label>
              <select id="galStatus" class="form-select">
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal__footer flex flex--between">
        <button class="btn btn--outline" id="btnCancelGal">Cancel</button>
        <button class="btn btn--primary" id="btnSaveGal">Save</button>
      </div>
    </div>
  </div>

  <script src="../js/data-store.js" defer></script>
  <script src="../js/modals.js" defer></script>
  <script src="../js/toast.js" defer></script>
  <script src="../js/forms.js" defer></script>
  <script src="../js/admin-gallery.js" defer></script>
</body>
</html>
