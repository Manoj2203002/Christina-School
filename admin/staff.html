<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management — Christina School Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header">
        <h2>Christina School</h2>
        <span>Admin Panel</span>
      </div>
      <nav class="admin-sidebar__nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="staff.html" class="active">👥 Staff</a>
        <a href="announcements.html">📣 Announcements</a>
        <a href="gallery.html">🖼️ Gallery</a>
        <a href="events.html">📅 Events</a>
        <a href="achievements.html">🏆 Achievements</a>
        <a href="news.html">📰 News</a>
        <a href="admissions.html">📝 Admissions</a>
        <a href="settings.html">⚙️ Settings</a>
        <hr>
        <a href="../index.html">🔗 View Website</a>
        <a href="login.html">🚪 Logout</a>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <div class="admin-topbar__search">
          <input type="text" id="searchInput" class="form-input" placeholder="Search staff...">
        </div>
        <div class="admin-topbar__actions">
          <span class="avatar avatar--sm"></span>
        </div>
      </header>
      <div class="admin-content">
        <div class="flex flex--between" style="margin-bottom: var(--space-6);">
          <h1 class="heading-3">Staff Management</h1>
          <button class="btn btn--primary" id="btnAddStaff">+ Add Staff</button>
        </div>
        
        <div class="card" style="margin-bottom: var(--space-6); padding: var(--space-4);">
          <div class="flex">
            <select id="filterDepartment" class="form-select" style="max-width: 200px;">
              <option value="">All Departments</option>
              <option value="Administration">Administration</option>
              <option value="Mathematics">Mathematics</option>
              <option value="Science">Science</option>
              <option value="English">English</option>
              <option value="Arts">Arts</option>
              <option value="Sports">Sports</option>
              <option value="Technology">Technology</option>
            </select>
          </div>
        </div>

        <div class="data-table--responsive">
          <table class="data-table" id="staffTable">
            <thead>
              <tr>
                <th>Photo</th>
                <th>Name</th>
                <th>Designation</th>
                <th>Department</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="staffTableBody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
          <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state__title">No staff found</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="staffModal">
    <div class="modal__backdrop"></div>
    <div class="modal__container">
      <div class="modal__header">
        <h3 class="heading-4" id="modalTitle">Add Staff</h3>
        <button class="modal__close">&times;</button>
      </div>
      <div class="modal__body">
        <form id="staffForm" novalidate>
          <input type="hidden" id="staffId">
          <div class="form-group">
            <label class="form-label">Photo URL</label>
            <input type="url" id="staffPhoto" class="form-input">
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Full Name <span class="required-star">*</span></label>
              <input type="text" id="staffName" class="form-input" data-required="true">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Designation <span class="required-star">*</span></label>
              <input type="text" id="staffDesignation" class="form-input" data-required="true">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Department <span class="required-star">*</span></label>
              <select id="staffDepartment" class="form-select" data-required="true">
                <option value="">Select...</option>
                <option value="Administration">Administration</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Science">Science</option>
                <option value="English">English</option>
                <option value="Arts">Arts</option>
                <option value="Sports">Sports</option>
                <option value="Technology">Technology</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Status</label>
              <select id="staffStatus" class="form-select">
                <option value="active">Active</option>
                <option value="on-leave">On Leave</option>
                <option value="resigned">Resigned</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Email <span class="required-star">*</span></label>
            <input type="email" id="staffEmail" class="form-input" data-required="true" data-type="email">
          </div>
          <div class="form-group">
            <label class="form-label">Phone <span class="required-star">*</span></label>
            <input type="tel" id="staffPhone" class="form-input" data-required="true">
          </div>
          <div class="form-group">
            <label class="form-label">Bio</label>
            <textarea id="staffBio" class="form-textarea" rows="3"></textarea>
          </div>
        </form>
      </div>
      <div class="modal__footer flex flex--between">
        <button class="btn btn--outline" id="btnCancelStaff">Cancel</button>
        <button class="btn btn--primary" id="btnSaveStaff">Save</button>
      </div>
    </div>
  </div>

  <script src="../js/data-store.js" defer></script>
  <script src="../js/modals.js" defer></script>
  <script src="../js/toast.js" defer></script>
  <script src="../js/forms.js" defer></script>
  <script src="../js/admin-staff.js" defer></script>
</body>
</html>
